# Isolated local infra. Host ports bind 127.0.0.1 only.
# Do not set PHLEBAS_MATCHER_URL on Vercel.

name: phlebas-local

services:
  matcher:
    build:
      context: ..
      dockerfile: services/Dockerfile
    command: ["node", "--experimental-strip-types", "services/matcher/server.ts"]
    environment:
      PHLEBAS_BIND: "0.0.0.0"
      PHLEBAS_ALLOW_NON_LOOPBACK: "1"
      PHLEBAS_PORT: "8788"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - matcher-data:/app/services/matcher/.data

volumes:
  matcher-data:
